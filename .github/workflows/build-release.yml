name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # setup-android v3 still installs the retired "tools" package and fails.
      # Install cmdline-tools directly instead.
      - name: Install Android SDK
        shell: pwsh
        env:
          ANDROID_HOME: C:\Android\android-sdk
        run: |
          $zip = Join-Path $env:TEMP "cmdline-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $zip
          $stage = Join-Path $env:TEMP "cmdline-tools-stage"
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          $target = Join-Path $env:ANDROID_HOME "cmdline-tools\latest"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $stage "cmdline-tools\*") $target -Recurse -Force
          $sdkmanager = Join-Path $target "bin\sdkmanager.bat"
          $null = ("y`n" * 40) | & $sdkmanager --licenses
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
          "ANDROID_HOME=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create CI debug keystore
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE ".android"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ks = Join-Path $dir "debug.keystore"
          if (-not (Test-Path $ks)) {
            & "$env:JAVA_HOME\bin\keytool.exe" -genkeypair -v `
              -keystore $ks -storepass android -keypass android `
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 `
              -dname "CN=Android Debug,O=Android,C=US"
            if ($LASTEXITCODE -ne 0) { throw "keytool failed" }
          }

      - name: Build
        shell: pwsh
        env:
          TVQP_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./build.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-quick-panel-apk
          path: tv-quick-panel.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tv-quick-panel-apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: tv-quick-panel.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
